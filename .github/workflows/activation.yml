name: Acquire activation file
on: workflow_dispatch

jobs:
  activation:
    name: Request .alf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: unityci/editor:ubuntu-6000.0.79f1-base-3
    steps:
      - name: Create manual activation file (.alf)
        run: |
          unity-editor -batchmode -nographics -quit \
            -createManualActivationFile -logFile /dev/stdout || true
          ls -la *.alf || { echo "NO ALF PRODUCED"; exit 1; }
      - name: Upload .alf
        uses: actions/upload-artifact@v4
        with:
          name: alf
          path: "*.alf"
          retention-days: 3
