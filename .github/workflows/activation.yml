name: Acquire activation file
on: workflow_dispatch

jobs:
  activation:
    name: Named-user activation → .ulf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: unityci/editor:ubuntu-6000.0.79f1-base-3
    steps:
      - name: Activate with username/password (named-user licensing)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          unity-editor -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -logFile /dev/stdout || true
          echo "── possible license locations ──"
          ls -la ~/.local/share/unity3d/Unity/ 2>/dev/null || true
          ls -la /usr/share/unity3d/config/ 2>/dev/null || true
          find / -name "Unity_lic.ulf" -o -name "*.ulf" 2>/dev/null | grep -v proc | head -5 || true
          mkdir -p /tmp/ulfout
          cp ~/.local/share/unity3d/Unity/Unity_lic.ulf /tmp/ulfout/ 2>/dev/null || \
          cp /usr/share/unity3d/config/Unity_lic.ulf /tmp/ulfout/ 2>/dev/null || \
          { F=$(find / -name "Unity_lic.ulf" 2>/dev/null | grep -v proc | head -1); [ -n "$F" ] && cp "$F" /tmp/ulfout/; }
          ls -la /tmp/ulfout/ && test -f /tmp/ulfout/Unity_lic.ulf
      - name: Upload .ulf
        uses: actions/upload-artifact@v4
        with:
          name: ulf
          path: /tmp/ulfout/Unity_lic.ulf
          retention-days: 1
