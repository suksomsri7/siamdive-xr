name: DiveMap CI (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: divemap-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: DiveMap
  UNITY_VERSION: 6000.0.79f1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) EditMode unit tests (QC_PLAN §1.1). Build gate depends on this being green.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: test-results
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # 2) Android APK build (only after tests pass). Build gate = QC_PLAN §1.3.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-build-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # CIBuild.BuildAndroid honors BUILD_PATH. Absolute container path maps to
          # the host workspace so the upload-artifact glob below can find the APK.
          BUILD_PATH: /github/workspace/build/Android/DiveMap.apk
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: DiveMap.EditorTools.CIBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Locate APK
        run: find . -name '*.apk' -not -path '*/Library/*' -not -path '*/Temp/*' -exec ls -la {} \;

  # ────────────────────────────────────────────────────────────────────────────
  # 3) Windows player (Mono) — เทสบน Windows Server ผ่าน RDP (เมาส์)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows player
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-win-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-win-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Locate output
        run: find . -name 'DiveMap.exe' -not -path '*/Library/*' -exec ls -la {} \; ; find build DiveMap/build -maxdepth 4 -type d 2>/dev/null | head -20

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-windows
          path: |
            build/StandaloneWindows64/
            DiveMap/build/StandaloneWindows64/
            DiveMap/Build/Windows/
          retention-days: 14
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-apk
          path: |
            build/**/*.apk
            DiveMap/build/**/*.apk
            DiveMap/Build/**/*.apk
          retention-days: 14
          if-no-files-found: error
