name: DiveMap CI (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      players:
        description: 'Build the installable players (APK + Windows). Off = tests + QC screenshot only.'
        type: boolean
        default: false
      ios:
        description: 'Build iOS and send it to TestFlight (macOS runner — 10x minutes once this repo is private).'
        type: boolean
        default: false

concurrency:
  # Split by EVENT, not just by ref. With one group per ref, pushing anything — a doc, a fix for
  # the next round — cancelled a TestFlight build already 15 minutes into IL2CPP, and the run
  # simply reads "cancelled" with no hint that a push did it. Pushes still cancel each other
  # (only the newest commit is worth testing); a hand-fired build now runs to the end.
  group: divemap-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: DiveMap
  UNITY_VERSION: 6000.0.79f1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) EditMode unit tests (QC_PLAN §1.1). Build gate depends on this being green.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: test-results
          retention-days: 14

      # ProjectSettings/ is not in git (IMPROVEMENTS A2): app name, bundle id, icon, orientation
      # and the graphics API order all come from Unity's defaults on every build, so no two builds
      # are guaranteed the same and nothing can be configured for iOS. Unity WRITES that folder on
      # first import, so the only way to get the real files without an Editor on the VPS is to take
      # them out of a run that just imported the project. Uploaded here to be committed once.
      - name: Upload ProjectSettings (to be committed — see IMPROVEMENTS A2)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProjectSettings
          path: DiveMap/ProjectSettings/**
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # 2b) iOS → TestFlight. The only way to put this app on an iPhone or iPad: Apple
  #     requires the build to happen on macOS, so this job runs on a rented Mac.
  #
  #     ⚠️ COST: macOS minutes bill at 10× on a PRIVATE repo. This repo is public until
  #     10 Aug 2026 (cron on the VPS flips it back), and while it is public these runners
  #     are free. After that, one ~45-minute iOS build spends ~450 of the 2,000 free
  #     minutes — about four builds a month. Deliberately kept behind workflow_dispatch
  #     for that reason, like the other players.
  #
  #     Signing lives here, not in the Unity step: Unity writes an unsigned Xcode project
  #     and fastlane signs it with the App Store Connect API key. Two steps, two distinct
  #     failure messages — a Unity error and a certificate error are different problems and
  #     should not both read as "iOS build failed".
  # ────────────────────────────────────────────────────────────────────────────
  ios:
    name: Build iOS → TestFlight
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    # macos-14 carried Xcode 15.4 = the iOS 17.5 SDK, and App Store Connect now refuses those
    # uploads: "All iOS and iPadOS apps must be built with the iOS 26 SDK or later". The runner
    # image is the only place that version is decided, so it is pinned here rather than left on
    # macos-latest, which moves under us the day GitHub promotes a new image.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fail early if the SDK is too old for App Store Connect
        run: |
          # Apple rejects at UPLOAD time, i.e. after ~15 minutes of IL2CPP, archive and sign.
          # Reading the version here turns that into a 5-second failure with the reason in it.
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -nE '1s/Xcode ([0-9]+).*/\1/p')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR ships an SDK App Store Connect no longer accepts (needs 26+)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-ios-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-ios-
            Library-

      # Before Unity, not after: the profile UUID has to be written INTO the Xcode project while
      # Unity generates it (CIBuild.BuildIos), because xcodebuild build settings cannot be aimed at
      # one target and UnityFramework must not inherit the app's profile.
      - name: Install the App Store provisioning profile
        env:
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_PROFILE_BASE64" ]; then
            echo "::error::APPLE_PROFILE_BASE64 is not set — nothing can be signed for TestFlight."
            exit 1
          fi
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          # A .mobileprovision is CMS-signed; the plist inside is what holds the UUID.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$DIR/$UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "installed: $NAME ($UUID) expires $EXPIRES"

      - name: Build Xcode project (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          # Monotonic and never reused, which is exactly what Apple requires of a build number.
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          # NOT BUILD_PATH: unity-builder exports that name itself and wins. Ours is namespaced.
          DM_BUILD_PATH: ${{ github.workspace }}/build/iOS
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: DiveMap.EditorTools.CIBuild.BuildIos
          allowDirtyBuild: true

      - name: Locate the Xcode project and check its plist
        run: |
          # FIND it, do not assume where it is. game-ci/unity-builder exports its own BUILD_PATH
          # and overrode ours, so Unity wrote the project under DiveMap/build/iOS while every
          # later step looked in build/iOS — an empty directory, and a 3-minute failure at the end
          # of a 45-minute job.
          PROJ=$(find . -maxdepth 5 -name 'Unity-iPhone.xcodeproj' -not -path '*/Library/*' | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::Unity reported success but produced no Xcode project"
            find . -maxdepth 4 -type d -name 'iOS*' -not -path '*/Library/*' || true
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "XCODE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "found: $DIR"
          ls -la "$DIR"

          # Unity is the only thing that can put the profile on the app target alone. If a Unity
          # upgrade ever stops honoring iOSManualProvisioningProfileID, the archive would fail 12
          # minutes later with "no profile matching", which reads like an Apple-account problem
          # rather than a generation problem. Check it here, where the answer is unambiguous.
          if ! grep -q "$IOS_PROFILE_UUID" "$PROJ/project.pbxproj"; then
            echo "::error::Unity did not write profile $IOS_PROFILE_UUID into the project."
            grep -oE 'PROVISIONING_PROFILE[A-Z_]* = [^;]*;' "$PROJ/project.pbxproj" | sort -u || true
            exit 1
          fi
          echo "profile $IOS_PROFILE_NAME is on the app target"

          bash tools/ios_app_icon.sh branding/AppIcon1024.png "$DIR/Unity-iPhone/Images.xcassets/AppIcon.appiconset"

          echo "── the plist keys that decide whether this build is usable ──"
          grep -A1 NSCameraUsageDescription "$DIR/Info.plist" || \
            echo "::error::NSCameraUsageDescription missing — AR would terminate the app on launch"
          # The half of AR that fails silently: no key, no CoreMotion, and Input.gyro.attitude
          # simply never changes. Nothing in the log says so — the model just sticks to the screen.
          grep -A1 NSMotionUsageDescription "$DIR/Info.plist" || \
            echo "::error::NSMotionUsageDescription missing — the phone's attitude sensor stays silent"
          # Without this the build reaches TestFlight but nobody can install it until someone
          # answers an export-compliance question by hand — a 45-minute round trip.
          grep -A1 ITSAppUsesNonExemptEncryption "$DIR/Info.plist" || \
            echo "::error::ITSAppUsesNonExemptEncryption missing — the build will sit in Missing Compliance"

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The team is at Apple's limit of 2 distribution certificates, so the runner imports the
          # existing one instead of asking the API key to create a third (it cannot).
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          XCODE_DIR: ${{ env.XCODE_DIR }}
        run: bash tools/ios_testflight.sh

      - name: Upload the Xcode project when something goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-xcode
          path: ${{ env.XCODE_DIR }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2) Android APK build (only after tests pass). Build gate = QC_PLAN §1.3.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android APK
    needs: test
    # Cost control (2026-07-30): a full round was 44 runner-minutes and 29 of them were players
    # nobody downloaded — we hand the user a build every 2-3 rounds, not every push. Tests + the
    # QC screenshot still run on every push, so nothing that CATCHES a bug was traded away.
    # Ask for a build with: gh workflow run "DiveMap CI (Android)" -f players=true
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-build-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # CIBuild.BuildAndroid honors BUILD_PATH. Absolute container path maps to
          # the host workspace so the upload-artifact glob below can find the APK.
          BUILD_PATH: /github/workspace/build/Android/DiveMap.apk
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: DiveMap.EditorTools.CIBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Locate APK
        run: find . -name '*.apk' -not -path '*/Library/*' -not -path '*/Temp/*' -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-apk
          path: |
            build/**/*.apk
            DiveMap/build/**/*.apk
            DiveMap/Build/**/*.apk
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 3) Windows player (Mono) — เทสบน Windows Server ผ่าน RDP (เมาส์)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows player
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-win-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-win-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Locate output
        run: find . -name 'DiveMap.exe' -not -path '*/Library/*' -exec ls -la {} \; ; find build DiveMap/build -maxdepth 4 -type d 2>/dev/null | head -20

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-windows
          path: |
            build/StandaloneWindows64/
            DiveMap/build/StandaloneWindows64/
            DiveMap/Build/Windows/
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 4) QC screenshot — Linux player รันบน xvfb ถ่ายภาพจริงของแอป (QC_PLAN ชั้น 2)
  # ────────────────────────────────────────────────────────────────────────────
  qc-shot:
    name: QC screenshot
    needs: test
    runs-on: ubuntu-latest
    # 90 ไม่ใช่ 60: shader ใหม่ (เช่น DM_FishWaveDetail) ทำ Library cache แตก → คอมไพล์ variant
    # ~5k ตัวกิน ~60 นาทีพอดีเพดานเดิม โดนตัดตอน 3956/5120 มาแล้ว 4 run ติด และการโดนตัด
    # ก่อน cache ถูกเซฟ = รอบถัดไปก็แตกอีก วนไม่รู้จบ
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-linux-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-linux-

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildLinux
          allowDirtyBuild: true

      - name: Run app headless and capture screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1 > /dev/null
          sudo chown -R "$USER:$USER" . || true
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          # 300 → 480 s. The same run now also does the MODEL pass (AppBoot.QcShot →
          # QcModelShot): six real GLBs pulled off the CDN (~12.6 MB), instantiated one at a
          # time through the app's own loader, and photographed close up — the models that
          # every previous QC screenshot has been unable to contain, because this scene builds
          # all but four of its objects out of generated geometry. The pass has its own 170 s
          # internal budget and quits itself, so this ceiling is the outer fuse, not the plan.
          timeout 480 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcshot "$PWD/qc_screenshot.png" -screen-width 1280 -screen-height 720 -force-glcore || true
          ls -la qc_screenshot.png || echo "::warning::no screenshot produced"
          ls -la qc_model_*.png || echo "::warning::no per-model QC shots — see [QCModel] lines in qc_player.log"
          # Find the log rather than guess its path: Unity puts it under the COMPANY NAME, so
          # renaming the company (which we did) silently produced no log at all — and the log is
          # half of what QC proves. `|| true` hid it perfectly.
          find ~/.config/unity3d -name Player.log -exec cp {} qc_player.log \; 2>/dev/null || true
          test -s qc_player.log || echo "::warning::no Player.log found under ~/.config/unity3d"
          # The per-model verdicts, in the step log itself, so "the wreck is black" or "the
          # wreck was never there" is visible without downloading a 20 MB artifact. A shot with
          # no model in it is logged FAIL by the harness (QcPixels.Passes), not quietly passed.
          grep -h '\[QCModel\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [QCModel] lines — the model QC pass did not run"

      # Second, SEPARATE run for the UI shots (WO-XR-05). It must not share a process
      # with -qcshot: that mode ends in Application.Quit(0) inside AppBoot.QcShot, so
      # queueing UI captures behind it would race the shutdown. In -qcshot mode the UI
      # shell refuses to build at all, keeping qc_screenshot*.png byte-comparable.
      - name: Run app headless and capture UI screenshots
        run: |
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          timeout 380 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcui "$PWD/qc_ui" -screen-width 1280 -screen-height 720 -force-glcore || true
          ls -la qc_ui_top.png qc_ui_menu.png qc_ui_maps.png qc_ui_worlds.png qc_ui_search.png qc_ui_palette.png qc_ui_palette_buy.png qc_ui_login.png qc_ui_seltool.png qc_ui_objlist.png qc_ui_revisions.png qc_ui_sculpt.png qc_ui_rope.png qc_ui_ropepanel.png qc_ui_mapsettings.png qc_ui_pin.png qc_ui_multiselect.png \
                 qc_ui_card.png qc_ui_settings.png qc_ui_en.png || echo "::warning::UI screenshots incomplete"
          find ~/.config/unity3d -name Player.log -exec cp {} qc_ui_player.log \; 2>/dev/null || true
          test -s qc_ui_player.log || echo "::warning::no Player.log found — QC log evidence missing"

      - name: Upload QC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qc-screenshot
          path: |
            qc_screenshot.png
            qc_screenshot2.png
            qc_model_*.png
            qc_player.log
            qc_ui*.png
            qc_ui_player.log
          retention-days: 14
          if-no-files-found: warn

