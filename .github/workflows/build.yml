name: DiveMap CI (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      players:
        description: 'Build the installable players (APK + Windows). Off = tests + QC screenshot only.'
        type: boolean
        default: true

concurrency:
  group: divemap-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: DiveMap
  UNITY_VERSION: 6000.0.79f1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) EditMode unit tests (QC_PLAN §1.1). Build gate depends on this being green.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: test-results
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # 2) Android APK build (only after tests pass). Build gate = QC_PLAN §1.3.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android APK
    needs: test
    # Cost control (2026-07-30): a full round was 44 runner-minutes and 29 of them were players
    # nobody downloaded — we hand the user a build every 2-3 rounds, not every push. Tests + the
    # QC screenshot still run on every push, so nothing that CATCHES a bug was traded away.
    # Ask for a build with: gh workflow run "DiveMap CI (Android)" -f players=true
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-build-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # CIBuild.BuildAndroid honors BUILD_PATH. Absolute container path maps to
          # the host workspace so the upload-artifact glob below can find the APK.
          BUILD_PATH: /github/workspace/build/Android/DiveMap.apk
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: DiveMap.EditorTools.CIBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Locate APK
        run: find . -name '*.apk' -not -path '*/Library/*' -not -path '*/Temp/*' -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-apk
          path: |
            build/**/*.apk
            DiveMap/build/**/*.apk
            DiveMap/Build/**/*.apk
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 3) Windows player (Mono) — เทสบน Windows Server ผ่าน RDP (เมาส์)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows player
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-win-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-win-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Locate output
        run: find . -name 'DiveMap.exe' -not -path '*/Library/*' -exec ls -la {} \; ; find build DiveMap/build -maxdepth 4 -type d 2>/dev/null | head -20

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-windows
          path: |
            build/StandaloneWindows64/
            DiveMap/build/StandaloneWindows64/
            DiveMap/Build/Windows/
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 4) QC screenshot — Linux player รันบน xvfb ถ่ายภาพจริงของแอป (QC_PLAN ชั้น 2)
  # ────────────────────────────────────────────────────────────────────────────
  qc-shot:
    name: QC screenshot
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-linux-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-linux-

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildLinux
          allowDirtyBuild: true

      - name: Run app headless and capture screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1 > /dev/null
          sudo chown -R "$USER:$USER" . || true
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcshot "$PWD/qc_screenshot.png" -screen-width 1280 -screen-height 720 -force-glcore || true
          ls -la qc_screenshot.png || { echo "::warning::no screenshot produced"; cp ~/.config/unity3d/SiamDive/DiveMap/Player.log qc_player.log 2>/dev/null || true; }
          cp ~/.config/unity3d/SiamDive/DiveMap/Player.log qc_player.log 2>/dev/null || true

      # Second, SEPARATE run for the UI shots (WO-XR-05). It must not share a process
      # with -qcshot: that mode ends in Application.Quit(0) inside AppBoot.QcShot, so
      # queueing UI captures behind it would race the shutdown. In -qcshot mode the UI
      # shell refuses to build at all, keeping qc_screenshot*.png byte-comparable.
      - name: Run app headless and capture UI screenshots
        run: |
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          timeout 380 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcui "$PWD/qc_ui" -screen-width 1280 -screen-height 720 -force-glcore || true
          ls -la qc_ui_menu.png qc_ui_maps.png qc_ui_worlds.png qc_ui_search.png qc_ui_palette.png qc_ui_palette_buy.png qc_ui_login.png qc_ui_seltool.png qc_ui_objlist.png qc_ui_revisions.png qc_ui_sculpt.png \
                 qc_ui_card.png qc_ui_settings.png qc_ui_en.png || echo "::warning::UI screenshots incomplete"
          cp ~/.config/unity3d/SiamDive/DiveMap/Player.log qc_ui_player.log 2>/dev/null || true

      - name: Upload QC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qc-screenshot
          path: |
            qc_screenshot.png
            qc_screenshot2.png
            qc_player.log
            qc_ui*.png
            qc_ui_player.log
          retention-days: 14
          if-no-files-found: warn

