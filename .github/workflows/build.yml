name: DiveMap CI (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      players:
        description: 'Build the installable players (APK + Windows). Off = tests + QC screenshot only.'
        type: boolean
        default: false
      ios:
        description: 'Build iOS and send it to TestFlight (macOS runner — 10x minutes once this repo is private).'
        type: boolean
        default: false
      ios_framework:
        description: 'Build UnityFramework.framework for the React Native app (macOS runner — unsigned, no TestFlight).'
        type: boolean
        default: false

concurrency:
  # Split by EVENT, not just by ref. With one group per ref, pushing anything — a doc, a fix for
  # the next round — cancelled a TestFlight build already 15 minutes into IL2CPP, and the run
  # simply reads "cancelled" with no hint that a push did it. Pushes still cancel each other
  # (only the newest commit is worth testing); a hand-fired build now runs to the end.
  group: divemap-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: DiveMap
  UNITY_VERSION: 6000.0.79f1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) EditMode unit tests (QC_PLAN §1.1). Build gate depends on this being green.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: test-results
          retention-days: 14

      # ProjectSettings/ is not in git (IMPROVEMENTS A2): app name, bundle id, icon, orientation
      # and the graphics API order all come from Unity's defaults on every build, so no two builds
      # are guaranteed the same and nothing can be configured for iOS. Unity WRITES that folder on
      # first import, so the only way to get the real files without an Editor on the VPS is to take
      # them out of a run that just imported the project. Uploaded here to be committed once.
      - name: Upload ProjectSettings (to be committed — see IMPROVEMENTS A2)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProjectSettings
          path: DiveMap/ProjectSettings/**
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # 2b) iOS → TestFlight. The only way to put this app on an iPhone or iPad: Apple
  #     requires the build to happen on macOS, so this job runs on a rented Mac.
  #
  #     ⚠️ COST: macOS minutes bill at 10× on a PRIVATE repo. This repo is public until
  #     10 Aug 2026 (cron on the VPS flips it back), and while it is public these runners
  #     are free. After that, one ~45-minute iOS build spends ~450 of the 2,000 free
  #     minutes — about four builds a month. Deliberately kept behind workflow_dispatch
  #     for that reason, like the other players.
  #
  #     Signing lives here, not in the Unity step: Unity writes an unsigned Xcode project
  #     and fastlane signs it with the App Store Connect API key. Two steps, two distinct
  #     failure messages — a Unity error and a certificate error are different problems and
  #     should not both read as "iOS build failed".
  # ────────────────────────────────────────────────────────────────────────────
  ios:
    name: Build iOS → TestFlight
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    # macos-14 carried Xcode 15.4 = the iOS 17.5 SDK, and App Store Connect now refuses those
    # uploads: "All iOS and iPadOS apps must be built with the iOS 26 SDK or later". The runner
    # image is the only place that version is decided, so it is pinned here rather than left on
    # macos-latest, which moves under us the day GitHub promotes a new image.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fail early if the SDK is too old for App Store Connect
        run: |
          # Apple rejects at UPLOAD time, i.e. after ~15 minutes of IL2CPP, archive and sign.
          # Reading the version here turns that into a 5-second failure with the reason in it.
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -nE '1s/Xcode ([0-9]+).*/\1/p')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR ships an SDK App Store Connect no longer accepts (needs 26+)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-ios-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-ios-
            Library-

      # Before Unity, not after: the profile UUID has to be written INTO the Xcode project while
      # Unity generates it (CIBuild.BuildIos), because xcodebuild build settings cannot be aimed at
      # one target and UnityFramework must not inherit the app's profile.
      - name: Install the App Store provisioning profile
        env:
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_PROFILE_BASE64" ]; then
            echo "::error::APPLE_PROFILE_BASE64 is not set — nothing can be signed for TestFlight."
            exit 1
          fi
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          # A .mobileprovision is CMS-signed; the plist inside is what holds the UUID.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$DIR/$UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "installed: $NAME ($UUID) expires $EXPIRES"

      - name: Build Xcode project (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          # Monotonic and never reused, which is exactly what Apple requires of a build number.
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          # NOT BUILD_PATH: unity-builder exports that name itself and wins. Ours is namespaced.
          DM_BUILD_PATH: ${{ github.workspace }}/build/iOS
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: DiveMap.EditorTools.CIBuild.BuildIos
          allowDirtyBuild: true

      - name: Locate the Xcode project and check its plist
        run: |
          # FIND it, do not assume where it is. game-ci/unity-builder exports its own BUILD_PATH
          # and overrode ours, so Unity wrote the project under DiveMap/build/iOS while every
          # later step looked in build/iOS — an empty directory, and a 3-minute failure at the end
          # of a 45-minute job.
          PROJ=$(find . -maxdepth 5 -name 'Unity-iPhone.xcodeproj' -not -path '*/Library/*' | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::Unity reported success but produced no Xcode project"
            find . -maxdepth 4 -type d -name 'iOS*' -not -path '*/Library/*' || true
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "XCODE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "found: $DIR"
          ls -la "$DIR"

          # Unity is the only thing that can put the profile on the app target alone. If a Unity
          # upgrade ever stops honoring iOSManualProvisioningProfileID, the archive would fail 12
          # minutes later with "no profile matching", which reads like an Apple-account problem
          # rather than a generation problem. Check it here, where the answer is unambiguous.
          if ! grep -q "$IOS_PROFILE_UUID" "$PROJ/project.pbxproj"; then
            echo "::error::Unity did not write profile $IOS_PROFILE_UUID into the project."
            grep -oE 'PROVISIONING_PROFILE[A-Z_]* = [^;]*;' "$PROJ/project.pbxproj" | sort -u || true
            exit 1
          fi
          echo "profile $IOS_PROFILE_NAME is on the app target"

          bash tools/ios_app_icon.sh branding/AppIcon1024.png "$DIR/Unity-iPhone/Images.xcassets/AppIcon.appiconset"

          echo "── the plist keys that decide whether this build is usable ──"
          grep -A1 NSCameraUsageDescription "$DIR/Info.plist" || \
            echo "::error::NSCameraUsageDescription missing — AR would terminate the app on launch"
          # The half of AR that fails silently: no key, no CoreMotion, and Input.gyro.attitude
          # simply never changes. Nothing in the log says so — the model just sticks to the screen.
          grep -A1 NSMotionUsageDescription "$DIR/Info.plist" || \
            echo "::error::NSMotionUsageDescription missing — the phone's attitude sensor stays silent"
          # Without this the build reaches TestFlight but nobody can install it until someone
          # answers an export-compliance question by hand — a 45-minute round trip.
          grep -A1 ITSAppUsesNonExemptEncryption "$DIR/Info.plist" || \
            echo "::error::ITSAppUsesNonExemptEncryption missing — the build will sit in Missing Compliance"

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The team is at Apple's limit of 2 distribution certificates, so the runner imports the
          # existing one instead of asking the API key to create a third (it cannot).
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          XCODE_DIR: ${{ env.XCODE_DIR }}
        run: bash tools/ios_testflight.sh

      - name: Upload the Xcode project when something goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-xcode
          path: ${{ env.XCODE_DIR }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2c) iOS → UnityFramework.framework ("Unity as a Library", WO-MERGE P0).
  #
  #     Same Unity step as the TestFlight job above, different ENDING: instead of
  #     archiving and signing an app, this builds ONLY the UnityFramework target and
  #     hands the framework back as an artifact, so the React Native app
  #     (com.siamdive.app, @azesmway/react-native-unity) can show Unity as one of its
  #     screens instead of the user having to install a second app.
  #
  #     A SEPARATE job on purpose, never a flag inside the ios job: that job is the
  #     channel the fish QC builds go to TestFlight through, and it has to keep
  #     working unchanged while this one is still being proven on a real iPhone.
  #
  #     Nothing here signs anything, which is why the "Install the App Store
  #     provisioning profile" step and the whole fastlane half are absent: a framework
  #     is signed by whoever EMBEDS it (the RN app, at EAS build time), so the runner
  #     needs no certificate, no profile and no App Store Connect key. Reusing
  #     CIBuild.BuildIos is safe for the same reason — with IOS_PROFILE_UUID unset it
  #     logs a warning and writes an unsigned Xcode project (CIBuild.cs, "Local builds
  #     open in Xcode and get signed by hand"), so no parallel build method is needed
  #     and the framework comes out of the exact same generator as the shipping app.
  # ────────────────────────────────────────────────────────────────────────────
  ios_framework:
    name: Build iOS UnityFramework
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios_framework
    # Pinned for the same reason as the ios job: this framework is embedded into
    # com.siamdive.app, which goes to TestFlight, and Apple checks the SDK of the whole
    # binary at upload. Building the Unity half against an older SDK would fail there —
    # one repo away, hours later, where nothing points back here.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fail early if the SDK is too old for App Store Connect
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -nE '1s/Xcode ([0-9]+).*/\1/p')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR ships an SDK App Store Connect no longer accepts (needs 26+)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Same key family as the ios job on purpose: both import the same project for the
      # same platform, so they should share one Library rather than each pay the ~20
      # minutes of a cold import. Whichever job finishes second just logs "cache already
      # exists" and moves on — that warning is the two jobs agreeing, not a fault.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-ios-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-ios-
            Library-

      - name: Build Xcode project (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # No IOS_PROFILE_UUID and no APPLE_TEAM_ID: with both empty Unity writes a
          # project with manual signing and no identity on any target, which is exactly
          # what CODE_SIGNING_ALLOWED=NO below expects. Handing it a team here would put
          # a DEVELOPMENT_TEAM on the framework target that nothing on this runner can
          # satisfy.
          #
          # IOS_BUILD_NUMBER is still set even though nothing is uploaded: it is what
          # BuildStamp writes into the player, i.e. the `bNNN` on the badge in the corner
          # of the screen — the only way to tell which CI run a framework on a phone
          # came from.
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          # NOT BUILD_PATH: unity-builder exports that name itself and wins. Ours is namespaced.
          DM_BUILD_PATH: ${{ github.workspace }}/build/iOS-framework
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: DiveMap.EditorTools.CIBuild.BuildIos
          allowDirtyBuild: true

      - name: Locate the Xcode project and read where Data landed
        run: |
          # FIND it, do not assume where it is — same lesson the ios job carries: unity-builder
          # exports its own BUILD_PATH and has overridden ours before, putting the project under
          # DiveMap/build/ while every later step read an empty build/.
          PROJ=$(find . -maxdepth 5 -name 'Unity-iPhone.xcodeproj' -not -path '*/Library/*' | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::Unity reported success but produced no Xcode project"
            find . -maxdepth 4 -type d -name 'iOS*' -not -path '*/Library/*' || true
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "XCODE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "found: $DIR"
          ls -la "$DIR"

          # The one thing that decides whether this artifact is usable at all. In "Unity as a
          # Library" the host app calls setDataBundleId("com.unity3d.framework"), i.e. Unity looks
          # for its Data folder INSIDE the framework bundle, not next to the app binary. Unity is
          # supposed to give Data target membership in UnityFramework itself; whether THIS Unity
          # version does is printed here rather than assumed, because if it stops doing it the
          # symptom on the phone is a black screen with no log line naming the cause.
          echo "── does UnityFramework claim the Data folder? ──"
          grep -nE '(Data (in Resources|\*/)|/\* Data \*/)' "$PROJ/project.pbxproj" | head -20 || \
            echo "no Data build-file entries found in project.pbxproj"
          ls -la "$DIR/Data" | head -10 || echo "::warning::no Data folder in the generated project"

      - name: Build UnityFramework (device arm64, unsigned)
        run: |
          set -o pipefail
          DD="${{ runner.temp }}/uf-derived"
          PROJ="$XCODE_DIR/Unity-iPhone.xcodeproj"

          # Unity generates the UnityFramework SCHEME, but a scheme is a file on disk that a
          # future Unity version could stop sharing, and "scheme not found" would arrive 0 seconds
          # into this step after 40 minutes of IL2CPP. The target always exists, so it is the
          # fallback: -target builds the same thing without needing xcshareddata.
          xcodebuild -list -project "$PROJ" || true
          if xcodebuild -list -project "$PROJ" 2>/dev/null | sed -n '/Schemes:/,$p' | grep -qE '^[[:space:]]+UnityFramework[[:space:]]*$'; then
            SEL=(-scheme UnityFramework)
          else
            echo "::warning::no shared UnityFramework scheme — building the target directly"
            SEL=(-target UnityFramework)
          fi

          # CODE_SIGNING_ALLOWED=NO because the RN app re-signs the framework when Xcode embeds
          # it; signing here would only require a certificate this runner deliberately does not
          # have. ONLY_ACTIVE_ARCH=NO with the generic iOS destination is what makes this arm64
          # device slices rather than whatever the runner happens to be.
          xcodebuild build \
            -project "$PROJ" \
            "${SEL[@]}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify the framework carries its Data folder
        run: |
          DD="${{ runner.temp }}/uf-derived"
          FW=$(find "$DD/Build/Products" -maxdepth 3 -type d -name 'UnityFramework.framework' | head -1)
          if [ -z "$FW" ]; then
            echo "::error::xcodebuild reported success but no UnityFramework.framework exists"
            find "$DD/Build/Products" -maxdepth 3 || true
            exit 1
          fi
          echo "FRAMEWORK=$FW" >> "$GITHUB_ENV"
          echo "framework: $FW"

          # If Unity did not give Data target membership, put it in by hand. Copying is safe
          # either way — the framework is the only place Unity will look once the host calls
          # setDataBundleId, so a Data folder outside it is dead weight, not an alternative.
          if [ ! -d "$FW/Data" ]; then
            echo "Data was not built into the framework — copying it from $XCODE_DIR"
            ditto "$XCODE_DIR/Data" "$FW/Data"
          fi

          if [ ! -d "$FW/Data" ] || [ -z "$(ls -A "$FW/Data" 2>/dev/null)" ]; then
            echo "::error::UnityFramework.framework has no Data — Unity would boot to a black screen"
            ls -la "$FW" || true
            exit 1
          fi
          # boot.config is the file the player reads first, so its absence is worth naming even
          # when the rest of Data is there; it is a warning and not a failure because Unity has
          # moved things around inside Data between versions and a missing filename is a weaker
          # signal than a missing folder.
          test -f "$FW/Data/boot.config" || \
            echo "::warning::no Data/boot.config — check the Data layout below against this Unity version"
          ls "$FW/Data" | head -20
          file "$FW/UnityFramework" || true
          du -sh "$FW"

      # ────────────────────────────────────────────────────────────────────────
      # The RN bridge contract (WO-MERGE P1). @azesmway/react-native-unity compiles
      # its iOS view from source inside the host's Pods, and that source opens with
      #     #include <UnityFramework/NativeCallProxy.h>          (ios/RNUnityView.mm:4)
      # so a framework without that header in Headers/ does not fail HERE — it fails
      # in the other repository, hours later, as "file not found" in a pod nobody
      # was editing. Unity marks plugin headers project-private by default; the
      # Editor post-processor Assets/Editor/IosNativeCallProxyHeader.cs makes this
      # one Public. This step is the proof that it worked, on the ARTIFACT rather
      # than in a log, and it is a hard failure because an artifact that cannot be
      # embedded is worth less than no artifact at all.
      # ────────────────────────────────────────────────────────────────────────
      - name: Verify the framework exports NativeCallProxy.h
        run: |
          H="$FRAMEWORK/Headers/NativeCallProxy.h"
          if [ ! -f "$H" ]; then
            echo "::error::UnityFramework.framework exports no Headers/NativeCallProxy.h — the RN pod cannot compile against this build."
            echo "── what IS exported ──"
            ls -la "$FRAMEWORK/Headers" 2>/dev/null || echo "(no Headers directory at all)"
            exit 1
          fi
          # Names, not just the file: the pod adopts the protocol and looks the class up by
          # string at run time (NSClassFromString(@"FrameworkLibAPI")), so a header that was
          # exported but edited into a different shape is the same outage one step later.
          # The first four are the RN pod's contract; the last two are ours (host detection,
          # WO-MERGE P1b) and are equally load-bearing — without them the embedded build cannot
          # tell it is embedded and opens whatever map the standalone app left in PlayerPrefs.
          for SYM in NativeCallsProtocol FrameworkLibAPI registerAPIforNativeCalls sendMessageToMobileApp \
                     dm_hostAttached dm_embeddedInHost; do
            grep -q "$SYM" "$H" || {
              echo "::error::Headers/NativeCallProxy.h does not mention $SYM — the bridge contract has drifted."
              cat "$H"
              exit 1
            }
          done
          echo "NativeCallProxy.h is public and carries every bridge symbol:"
          grep -nE 'NativeCallsProtocol|FrameworkLibAPI|sendMessageToMobileApp|registerAPIforNativeCalls|dm_hostAttached|dm_embeddedInHost' "$H"

      - name: Package the framework
        run: |
          STAGE="${{ runner.temp }}/UnityFramework-ios"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # ditto, not cp/zip: a framework is a bundle whose symlinks and permissions matter, and
          # upload-artifact flattens both. Zipping it here means what the RN repo downloads is
          # byte-identical to what came out of xcodebuild (GitHub wraps this zip in its own —
          # unzip twice).
          ditto "$FRAMEWORK" "$STAGE/UnityFramework.framework"

          # Which commit a framework on a phone came from is otherwise unanswerable: the RN app
          # pins an artifact, not a source tree, and the badge only carries the run number.
          {
            echo "artifact:     UnityFramework-ios"
            echo "commit:       ${{ github.sha }}"
            echo "ref:          ${{ github.ref }}"
            echo "run_number:   ${{ github.run_number }}  (= bNNN on the in-app badge)"
            echo "run_id:       ${{ github.run_id }}"
            echo "unity:        ${{ env.UNITY_VERSION }}"
            echo "xcode:        $(xcodebuild -version | head -1)"
            echo "built:        $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "size:         $(du -sh "$STAGE/UnityFramework.framework" | cut -f1)"
            echo "signing:      none — the host app signs the framework when it embeds it"
            echo "host must call: [ufw setDataBundleId:\"com.unity3d.framework\"] (Data is inside the bundle)"
          } > "$STAGE/MANIFEST.txt"
          cat "$STAGE/MANIFEST.txt"

          ditto -c -k --keepParent "$STAGE" "${{ runner.temp }}/UnityFramework-ios.zip"
          ls -la "${{ runner.temp }}/UnityFramework-ios.zip"

      - name: Upload UnityFramework
        uses: actions/upload-artifact@v4
        with:
          name: UnityFramework-ios
          path: ${{ runner.temp }}/UnityFramework-ios.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload the Xcode project when something goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnityFramework-xcode
          path: ${{ env.XCODE_DIR }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2) Android APK build (only after tests pass). Build gate = QC_PLAN §1.3.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android APK
    needs: test
    # Cost control (2026-07-30): a full round was 44 runner-minutes and 29 of them were players
    # nobody downloaded — we hand the user a build every 2-3 rounds, not every push. Tests + the
    # QC screenshot still run on every push, so nothing that CATCHES a bug was traded away.
    # Ask for a build with: gh workflow run "DiveMap CI (Android)" -f players=true
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-build-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # CIBuild.BuildAndroid honors BUILD_PATH. Absolute container path maps to
          # the host workspace so the upload-artifact glob below can find the APK.
          BUILD_PATH: /github/workspace/build/Android/DiveMap.apk
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: DiveMap.EditorTools.CIBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Locate APK
        run: find . -name '*.apk' -not -path '*/Library/*' -not -path '*/Temp/*' -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-apk
          path: |
            build/**/*.apk
            DiveMap/build/**/*.apk
            DiveMap/Build/**/*.apk
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 3) Windows player (Mono) — เทสบน Windows Server ผ่าน RDP (เมาส์)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows player
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.players
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-win-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-win-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Locate output
        run: find . -name 'DiveMap.exe' -not -path '*/Library/*' -exec ls -la {} \; ; find build DiveMap/build -maxdepth 4 -type d 2>/dev/null | head -20

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiveMap-windows
          path: |
            build/StandaloneWindows64/
            DiveMap/build/StandaloneWindows64/
            DiveMap/Build/Windows/
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 4) QC screenshot — Linux player รันบน xvfb ถ่ายภาพจริงของแอป (QC_PLAN ชั้น 2)
  # ────────────────────────────────────────────────────────────────────────────
  qc-shot:
    name: QC screenshot
    needs: test
    runs-on: ubuntu-latest
    # 150 ไม่ใช่ 90: (ประวัติ: 90 ไม่ใช่ 60 เพราะ shader ใหม่ทำ Library cache แตก → คอมไพล์ variant
    # ~5k ตัวกิน ~60 นาที) — 4 ส.ค. แก้ DM_FishWaveDetail อีกรอบ + QC โตขึ้น (7 แมพ + โมเดลเพิ่ม
    # ฉลามวาฬ/แมนตา + QcAnimShot + ดาวน์โหลด CDN ใหม่หลัง dilation ทั้งคลัง) → 90 โดนตัดที่
    # นาทีสุดท้ายพอดี (run 30887364898) และการโดนตัดก่อน cache เซฟ = รอบถัดไปแตกซ้ำ วนไม่จบ
    # 180 ไม่ใช่ 150: 11 ส.ค. -qcblank (positive control หมอกค้าง WO-K) เพิ่มเข้า job นี้ แล้ว
    # run 31442231470 โดนตัดที่ 155 นาที (build เย็น ~90 + qc ~56) — harness ถูกรีดงบลงแล้ว
    # (แมพเล็ก/640×360/ฟิวส์ 360s) เหลือหัวข้อเดียวคือเคส Library cache แตก จึงขยายเพดานแทน
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-linux-${{ hashFiles('DiveMap/Packages/manifest.json') }}
          restore-keys: |
            Library-linux-

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: DiveMap.EditorTools.CIBuild.BuildLinux
          allowDirtyBuild: true

      - name: Run app headless and capture screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1 > /dev/null
          sudo chown -R "$USER:$USER" . || true
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          # 300 → 480 s. The same run now also does the MODEL pass (AppBoot.QcShot →
          # QcModelShot): real GLBs pulled off the CDN, instantiated one at a time through the
          # app's own loader, and photographed close up — the models that every previous QC
          # screenshot has been unable to contain, because this scene builds all but four of its
          # objects out of generated geometry. The pass has its own internal budget and quits
          # itself, so this ceiling is the outer fuse, not the plan.
          #
          # 480 → 1120 s for the MAP pass (AppBoot.QcShot → QcMapShot), which runs behind the
          # model pass and photographs all SEVEN maps from the diver's-eye pose. It fetches each
          # map from the production API and builds every GLB in it — Posidon alone is 90 items —
          # so it carries its own budgets: 150 s per map and 600 s for the pass, after which it
          # logs `budget-exhausted` per map and returns. This fuse is 480 + 600 + 40 s of slack,
          # i.e. it sits BEHIND the pass's own budget so a slow CDN produces a report rather
          # than a killed process. A `timeout` kill truncates Player.log, and the log is the
          # other half of what these passes produce.
          #
          # 1120 → 1220 s for WO-F3's ANIM pass, which runs behind the others: three rigged GLBs
          # downloaded, played and measured, no picture taken. Its own budget is 30 s per model
          # plus 6 frames — ~100 s worst case — and the fuse moves with it, because a timeout kill
          # truncates Player.log and the log is the only evidence this pass produces.
          #
          # 1220 → 1350 s for WO-L, which took the model pass from eight models to twelve and its
          # internal budget from 170 to 300 s. The fuse tracks the sum of the three passes' own
          # budgets (300 + 600 + 100) plus the same ~350 s of slack it has always carried, so it
          # still sits BEHIND them: a slow CDN produces a report rather than a killed process.
          # 1350 s is 22.5 min against this job's 150 min ceiling, so there is no interaction.
          timeout 1350 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcshot "$PWD/qc_screenshot.png" -screen-width 1280 -screen-height 720 -force-glcore || true
          # SchoolClip v2 — คลิปฝูงบาราคูด้า 150 เฟรม (5 วิเวลาเกม) ให้ orchestrator วัดการ
          # เคลื่อนไหวจริงก่อนตัดสินทุกการแก้ motion (เกิดจากมหากาพย์ส่ายหัว 8 ส.ค.)
          #
          # ถ่าย 2 แมพ เพราะ school:barracuda ตัวเดียวกันถูกวางคนละสเกล: Chang 9.2 (ตัวยาว
          # 17.1u) · Harddeep 3.87 (7.2u) — user ชี้ให้ไปดู Harddeep และคลิปที่ถ่ายได้แมพเดียว
          # พิสูจน์อีกแมพไม่ได้ · 960x540 → 1280x720 เพราะ v1 วัดหัวปลาไม่ได้ (ปลาไม่กี่พิกเซล)
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -schoolclip "$PWD/clip" -screen-width 1280 -screen-height 720 -force-glcore || true
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -schoolclip "$PWD/clip_hardeep" -clipmap 874ti6ignvp9 \
            -screen-width 1280 -screen-height 720 -force-glcore || true
          # "ปลาไถลข้าง" — ถ่ายสามตัวเลือกที่ user ต้องเลือก ในรอบเดียว (A เดิม / B จำกัด 30° /
          # C ตามทางเต็มที่) เพื่อให้ user ตัดสินจากภาพเคลื่อนไหวจริง ไม่ใช่จากกราฟ
          # 🔴 -clipmode cluster: อาการ "ไถลข้าง" มีเฉพาะโหมด polarised — สองรอบแรกฝูงบังเอิญ
          # อยู่โหมดวงแหวนตอนถ่าย วัดได้ 4.8° เท่ากันทั้งก่อน/หลังแก้ = ถ่ายไม่ตรงเงื่อนไข
          for V in off cap full; do
            timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
              "$BIN" -schoolclip "$PWD/clip_nose_$V" -clipmap 874ti6ignvp9 -clipnose "$V" \
              -clipmode cluster -screen-width 1280 -screen-height 720 -force-glcore || true
          done
          ls clip/ 2>/dev/null | wc -l
          ls clip_hardeep/ 2>/dev/null | wc -l
          ls clip_nose_off/ clip_nose_cap/ clip_nose_full/ 2>/dev/null | wc -l
          grep -h '\[Clip\]' qc_player.log 2>/dev/null || true
          ls -la qc_screenshot.png || echo "::warning::no screenshot produced"
          ls -la qc_model_*.png || echo "::warning::no per-model QC shots — see [QCModel] lines in qc_player.log"
          ls -la qc_map_*.png || echo "::warning::no per-map QC shots — see [QCMap] lines in qc_player.log"
          # Find the log rather than guess its path: Unity puts it under the COMPANY NAME, so
          # renaming the company (which we did) silently produced no log at all — and the log is
          # half of what QC proves. `|| true` hid it perfectly.
          find ~/.config/unity3d -name Player.log -exec cp {} qc_player.log \; 2>/dev/null || true
          test -s qc_player.log || echo "::warning::no Player.log found under ~/.config/unity3d"
          # The per-model verdicts, in the step log itself, so "the wreck is black" or "the
          # wreck was never there" is visible without downloading a 20 MB artifact. A shot with
          # no model in it is logged FAIL by the harness (QcPixels.Passes), not quietly passed.
          grep -h '\[QCModel\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [QCModel] lines — the model QC pass did not run"
          # WO-L — one [QCFidelity] line per model: did the renderer keep the pattern the texture
          # file has? Read meanL first (the additive-wash detector), then hpRms (the pattern
          # amplitude, which a lighting change must NOT move). See Core/QcFidelity.cs.
          grep -h '\[QCFidelity\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [QCFidelity] lines — the fidelity probe did not run"
          # …and the same for the maps. One [QCMap] line per map carries the verdict and the
          # numbers behind it (dark%, subject%, waterLum, fogWork, backdropSpan), so a regression
          # is readable in the step log without downloading the pictures; [QCBlack] carries the
          # ray-probe and torch answers for whatever is dark in the frame. A missing line means
          # the pass never ran, which reads very differently from a pass that ran and failed.
          grep -h '\[QCMap\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [QCMap] lines — the map QC pass did not run"
          grep -h '\[QCBlack\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [QCBlack] lines — nothing probed the dark region"
          # WO-F3's oracle. One [Anim] line per animal and per QC model, carrying clips=N, the
          # clip actually picked, its length, the playback rate and — when the wave shader stood
          # in instead — the one-token REASON. "the turtle does not animate" has four causes
          # (the GLB ships no clip / com.unity.modules.animation is missing so glTFast compiled
          # its whole animation path out / the wrong clip was picked / it is playing at 0.06x)
          # and no screenshot separates any of them. clips=0 on every line means the asset
          # pipeline baked the clips out; clips=6 with mode=wave means this app dropped them.
          #
          # The QcAnimShot lines carry the part no pixel can show — verdict=, which is one of:
          #   no-clips     the GLB shipped no animation          (asset pipeline)
          #   no-skin      clips arrived, the skinned mesh did not (Draco / import)
          #   frozen-pose  curves exist and move nothing          (rig transfer hit wrong joints)
          #   frozen-live  the file is fine, the app is not ticking it   (this app)
          #   moving       it works
          # poseDelta is measured with Animation.Sample() and is frame-rate-free; liveDelta and
          # advanced= come from real frames, so poseDelta>0 with liveDelta=0 names the app.
          grep -h '\[Anim\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [Anim] lines — nothing decided between clip and wave"
          # The swim oracle, for the same reason: a screenshot cannot show a beat rate, so
          # "ครีบขยับเร็วไปมาก" can only ever be checked against numbers. One [Swim] line per school
          # and per hero animal, carrying worldLen and beatHz; the targets are in SwimStyleTests.
          grep -h '\[Swim\]' qc_player.log 2>/dev/null || \
            echo "::warning::no [Swim] lines — no animal resolved a swim style"
          # 🔴 The no-reversing invariant ("ห้ามว่ายถอยหลัง", user on build 261). Unlike every
          # other line here, NO OUTPUT IS THE PASS: [SwimBack] is only ever logged when an animal's
          # nose pointed against the way it actually moved. It carries dotXZ (−1 = straight
          # backwards) and which school or asset did it. Reported once per animal/school, because
          # a reversing animal reverses for hundreds of frames.
          if grep -h '\[SwimBack\]' qc_player.log 2>/dev/null; then
            echo "::error::an animal swam backwards — see the [SwimBack] lines above"
          else
            echo "no [SwimBack] lines — nothing swam backwards (this is the pass)"
          fi

      # Second, SEPARATE run for the UI shots (WO-XR-05). It must not share a process
      # with -qcshot: that mode ends in Application.Quit(0) inside AppBoot.QcShot, so
      # queueing UI captures behind it would race the shutdown. In -qcshot mode the UI
      # shell refuses to build at all, keeping qc_screenshot*.png byte-comparable.
      - name: Run app headless and capture UI screenshots
        run: |
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          timeout 380 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -qcui "$PWD/qc_ui" -screen-width 1280 -screen-height 720 -force-glcore || true
          ls -la qc_ui_top.png qc_ui_menu.png qc_ui_maps.png qc_ui_worlds.png qc_ui_search.png qc_ui_palette.png qc_ui_palette_buy.png qc_ui_login.png qc_ui_seltool.png qc_ui_objlist.png qc_ui_revisions.png qc_ui_sculpt.png qc_ui_rope.png qc_ui_ropepanel.png qc_ui_mapsettings.png qc_ui_pin.png qc_ui_multiselect.png \
                 qc_ui_card.png qc_ui_settings.png qc_ui_en.png || echo "::warning::UI screenshots incomplete"
          find ~/.config/unity3d -name Player.log -exec cp {} qc_ui_player.log \; 2>/dev/null || true
          test -s qc_ui_player.log || echo "::warning::no Player.log found — QC log evidence missing"

          # ── the shots that have to prove themselves (WO-Q) ────────────────────
          #
          # 🔴 Run 31513452365 filed two photographs of the DRONE TOUR HUD as evidence for the
          # three axis arrows. Nothing in CI objected, because a screenshot call cannot fail: it
          # writes whatever is on the screen and a wrong screen is still a valid PNG. The gizmo
          # shots now carry their own verdict (QcGizmoWitness → [QcShot] lines), and this is where
          # a verdict of "do not believe this picture" becomes a red build.
          #
          # Missing lines are red too. "The witness never ran" and "the witness passed" must not
          # look the same from out here — that equivalence is the whole bug being fixed.
          echo "── shot proofs ──"
          grep -F '[QcShot]' qc_ui_player.log || true
          if grep -qF 'INVALID SHOT' qc_ui_player.log 2>/dev/null; then
            echo "::error::a QC shot did not photograph what it claims — see the [QcShot] lines above"
            grep -F '[UI] qcui gizmo' qc_ui_player.log || true
            grep -F '[Tour] auto-play' qc_ui_player.log || true
            exit 1
          fi
          if ! grep -qF '[QcShot]' qc_ui_player.log 2>/dev/null; then
            echo "::error::no [QcShot] proof lines — the gizmo shots were never checked, so they prove nothing"
            tail -40 qc_ui_player.log || true
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────
      # POSITIVE CONTROL — "enter map A, leave mid-tour, open map B, the world is
      # one flat navy colour while the HUD keeps working" (WO-MERGE P1e).
      #
      # 🔴 This step is a CONTROL, not a check. It runs the sequence TWICE in one
      # player: once with the atmosphere reset suppressed, which must come out
      # blank, and once as shipped, which must not. It fails the job in BOTH
      # directions — and the direction that matters most is the first one, because
      # a "before" frame that is NOT blank means the reproduction stopped
      # reproducing and the instrument has gone blind. A green tick from a blind
      # instrument is how this bug survived four device rounds.
      #
      # Both mean-luminance numbers land in verdict.txt and in the log, so the
      # planner can see how close to the thresholds the run actually was rather
      # than just which way it fell. Not `|| true`: this one is allowed to be red.
      #
      # 🔴 BUDGET, learned the expensive way. The first version of this step used the
      # two maps from the bug report (Chang → Posidon) at 720p and a 900 s timeout.
      # Four heavy loads on llvmpipe overran the JOB's 150-minute budget, run
      # 31442231470 was cancelled with no verdict at all, and it took the unrelated
      # palette screenshots in this same job down with it. What is being proven is a
      # property of global render state, so map size was never relevant — it now uses
      # the two lightest maps in the catalogue (Tu-1, 1 item → Hanuman, 13 items, no
      # fish schools) at 640×360.
      #
      # The shell timeout is set ABOVE the harness's own 300 s budget on purpose: the
      # harness is meant to expire first and WRITE a verdict; `timeout` here is only
      # the backstop for a hang underneath it. Either way the job moves on, and the
      # artifact upload below is if: always().
      # ────────────────────────────────────────────────────────────────────────
      - name: Positive control — a map switch must not inherit the tour's fog
        run: |
          BIN=$(find . -path '*/build/*' -name 'DiveMap' -type f | head -1)
          echo "BIN=$BIN"; chmod +x "$BIN"
          mkdir -p qc_blank
          set +e
          timeout 360 xvfb-run -a -s "-screen 0 640x360x24" \
            "$BIN" -qcblank "$PWD/qc_blank" -screen-width 640 -screen-height 360 -force-glcore
          RC=$?
          set -e
          find ~/.config/unity3d -name Player.log -exec cp {} qc_blank/player.log \; 2>/dev/null || true

          echo "── verdict ──"
          cat qc_blank/verdict.txt 2>/dev/null || echo "(no verdict written)"

          # 🔴 The trace is the point of this run (WO-MERGE P1h). Printed IN FULL and in order,
          # not tailed: the question it answers is "which is the FIRST checkpoint where the
          # atmosphere stops being dark", and a tail can cut the answer off the top. Bounded by
          # construction — seven checkpoints per pass.
          echo "── trace (first non-dark checkpoint is the answer) ──"
          grep -F '[QcBlankTrace]' qc_blank/player.log 2>/dev/null || echo "(no trace lines)"
          echo "── measurements ──"
          grep -F '[QcBlank]' qc_blank/player.log 2>/dev/null | grep -vF 'Trace' | tail -30 || true
          echo "── atmosphere resets ──"
          grep -F '[Atmos]' qc_blank/player.log 2>/dev/null | tail -10 || true
          ls -la qc_blank || true

          if [ ! -s qc_blank/verdict.txt ]; then
            echo "::error::the control produced no verdict (exit $RC) — it did not run to the end, so nothing is proven"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::$(cat qc_blank/verdict.txt)"
            exit 1
          fi
          echo "$(cat qc_blank/verdict.txt)"

      - name: Upload QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-screenshot
          path: |
            qc_blank/
            qc_screenshot.png
            qc_screenshot2.png
            qc_model_*.png
            # 🔴 The map shots are the only frames in CI that show what the PLAYER sees. The first
            # run of QcMapShot wrote seven of them and NONE left the runner, because this list had
            # never needed a new glob before — so the round that was meant to end "we only ever
            # photograph models on a grey backdrop" ended with exactly the same evidence as always.
            # A new QC pass that writes files is not finished until its glob is on this list.
            qc_map_*.png
            clip/clip_*.png
            clip_hardeep/clip_*.png
            clip_nose_*/clip_*.png
            qc_player.log
            qc_ui*.png
            qc_ui_player.log
          retention-days: 14
          if-no-files-found: warn

